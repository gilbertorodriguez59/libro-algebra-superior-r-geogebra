name: Validar edición estable

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Quarto y TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.1
          tinytex: true

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Validar fuentes y materiales
        run: python3 scripts/validate_publication.py

      - name: Ejecutar código R y cuadernos
        run: python3 scripts/validate_publication.py --run-r

      - name: Generar HTML y PDF
        run: quarto render

      - name: Validar publicación generada
        run: python3 scripts/validate_publication.py --rendered
