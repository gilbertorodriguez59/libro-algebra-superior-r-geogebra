<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de temporización para A, B, C y X</title>
  <desc id="desc">Se muestran seis intervalos de tiempo para las entradas binarias A, B y C y para la salida X igual a A o no B, y C.</desc>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#123b6d">Diagrama de temporización: X = (A + ¬B) · C</text>
  <g stroke="#d7e2eb" stroke-width="2">
    <line x1="170" y1="90" x2="1130" y2="90"/><line x1="170" y1="210" x2="1130" y2="210"/>
    <line x1="170" y1="230" x2="1130" y2="230"/><line x1="170" y1="350" x2="1130" y2="350"/>
    <line x1="170" y1="370" x2="1130" y2="370"/><line x1="170" y1="490" x2="1130" y2="490"/>
    <line x1="170" y1="510" x2="1130" y2="510"/><line x1="170" y1="590" x2="1130" y2="590"/>
    <line x1="170" y1="80" x2="170" y2="590"/><line x1="330" y1="80" x2="330" y2="590"/>
    <line x1="490" y1="80" x2="490" y2="590"/><line x1="650" y1="80" x2="650" y2="590"/>
    <line x1="810" y1="80" x2="810" y2="590"/><line x1="970" y1="80" x2="970" y2="590"/>
    <line x1="1130" y1="80" x2="1130" y2="590"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="25" font-weight="700">
    <text x="90" y="160" fill="#1f77b4">A</text>
    <text x="90" y="300" fill="#d65a4a">B</text>
    <text x="90" y="440" fill="#2c7a5a">C</text>
    <text x="90" y="560" fill="#8a5fb0">X</text>
  </g>
  <g fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="square">
    <path d="M170 190 H330 V110 H650 V190 H970 V110 H1130" stroke="#1f77b4"/>
    <path d="M170 250 H490 V330 H810 V250 H1130" stroke="#d65a4a"/>
    <path d="M170 470 H330 V390 H810 V470 H970 V390 H1130" stroke="#2c7a5a"/>
    <path d="M170 570 H330 V530 H810 V570 H970 V530 H1130" stroke="#8a5fb0"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="18" fill="#52687a" text-anchor="middle">
    <text x="170" y="610">0</text><text x="330" y="610">1</text><text x="490" y="610">2</text>
    <text x="650" y="610">3</text><text x="810" y="610">4</text><text x="970" y="610">5</text><text x="1130" y="610">6</text>
  </g>
</svg>
