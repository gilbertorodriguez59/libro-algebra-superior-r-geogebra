<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Circuito lógico para X igual a A o no B, y C</title>
  <desc id="desc">Las entradas A y B llegan a una compuerta OR; B pasa antes por un inversor. La salida de OR se combina con C mediante una compuerta AND para producir X.</desc>
  <rect width="1200" height="520" fill="#f7fbff"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#123b6d">Circuito para X = (A + ¬B) · C</text>
  <g font-family="Arial, sans-serif" font-size="26" fill="#18344f" stroke="#18344f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <text x="75" y="150" stroke="none">A</text>
    <text x="75" y="260" stroke="none">B</text>
    <text x="75" y="390" stroke="none">C</text>
    <line x1="115" y1="142" x2="390" y2="142"/>
    <line x1="115" y1="252" x2="215" y2="252"/>
    <path d="M215 220 L285 252 L215 284 Z" fill="#ffffff"/>
    <circle cx="300" cy="252" r="14" fill="#ffffff"/>
    <line x1="314" y1="252" x2="390" y2="252"/>
    <path d="M390 112 Q455 118 515 197 Q455 276 390 282 Q423 197 390 112 Z" fill="#eaf3fb"/>
    <line x1="515" y1="197" x2="720" y2="197"/>
    <line x1="115" y1="382" x2="720" y2="382"/>
    <path d="M720 157 L790 157 A112 112 0 0 1 790 422 L720 422 Z" fill="#eef8f3"/>
    <line x1="902" y1="289" x2="1070" y2="289"/>
    <text x="1090" y="298" stroke="none" font-weight="700">X</text>
    <text x="446" y="207" stroke="none" text-anchor="middle" font-size="23" font-weight="700">OR</text>
    <text x="767" y="300" stroke="none" text-anchor="middle" font-size="23" font-weight="700">AND</text>
    <text x="248" y="327" stroke="none" text-anchor="middle" font-size="20">NOT</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="20" fill="#52687a">
    <text x="600" y="485" text-anchor="middle">La burbuja en la salida del inversor representa la negación de B.</text>
  </g>
</svg>
